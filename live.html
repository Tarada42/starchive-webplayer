<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Currently live DJs on STArchive — play high-quality streams directly." />
    <title>Live DJs — STArchive</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap");
      :root {
        --bg: #0a0a0f;
        --surface: #111118;
        --surface2: #1a1a24;
        --surface3: #222230;
        --border: #ffffff12;
        --accent: #7c3aed;
        --accent2: #a855f7;
        --accent-glow: #7c3aed4d;
        --text: #f0f0f8;
        --text2: #9090b0;
        --text3: #5a5a7a;
        --red: #ef4444;
        --green: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        line-height: 1.5;
        min-height: 100vh;
      }
      a { color: inherit; text-decoration: none; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 32px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        color: var(--text);
      }
      .brand .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }
      .back {
        color: var(--text2);
        font-size: 0.9rem;
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: 999px;
        transition: 0.15s;
      }
      .back:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }
      h1 { font-family: "Syne", sans-serif; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 8px; }
      .subtitle { color: var(--text2); margin-bottom: 28px; }
      .status { color: var(--text2); font-size: 0.9rem; margin-bottom: 16px; }
      .status .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
        margin-right: 6px;
        box-shadow: 0 0 6px var(--red);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .dj-grid { display: grid; gap: 16px; }
      .dj-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        transition: 0.15s;
      }
      .dj-card:hover { border-color: var(--accent); background: var(--surface2); }
      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        flex-shrink: 0;
        object-fit: cover;
        background: var(--surface3);
        border: 1px solid var(--border);
      }
      .avatar-fallback {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface3);
        color: var(--text2);
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        border: 1px solid var(--border);
      }
      .info { flex: 1; min-width: 0; }
      .name {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        margin: 0 0 4px;
        cursor: pointer;
      }
      .name:hover { color: var(--accent2); }
      .title {
        color: var(--text2);
        font-size: 0.95rem;
        margin: 0 0 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .twitch-stats {
        color: var(--text3);
        font-size: 0.8rem;
        margin-bottom: 12px;
        min-height: 1.2em;
      }
      .open-external {
        display: inline-block;
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--accent2);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 999px;
        text-decoration: none;
        transition: 0.15s;
      }
      .open-external:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }
      .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .card-actions .open-external { margin-top: 0; }
      .watch-twitch { display: inline-block; }
      audio { width: 100%; height: 40px; border-radius: 8px; }
      .empty { text-align: center; color: var(--text2); padding: 48px 0; }
      .empty-emoji { color: var(--text3); margin-bottom: 14px; display: flex; justify-content: center; }
      .empty-emoji svg { width: 40px; height: 40px; }
      .empty-title { margin: 0 0 6px; color: var(--text); font-size: 1.05rem; font-weight: 600; }
      .empty-sub { margin: 0; font-size: .88rem; }
      .empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
      .joke-btn {
        font: inherit; font-size: .84rem; padding: 8px 15px; border-radius: 999px;
        border: 1px solid var(--border); background: transparent; color: var(--text2);
        cursor: pointer; text-decoration: none; transition: .15s;
      }
      .joke-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface2); }
      .joke-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .joke-btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
      .joke-box {
        margin: 20px auto 0; max-width: 540px; text-align: left;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; padding: 18px 20px;
      }
      .joke-text { margin: 0 0 14px; color: var(--text); font-size: .95rem; line-height: 1.5; }
      .joke-meta { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
      .dj-card.is-playing-target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow, rgba(124,58,237,.45)); }
      .error { color: var(--red); }
      .loading { color: var(--text2); padding: 40px 0; text-align: center; }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 100;
      }
      .modal-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        width: 100%;
        max-width: 520px;
        max-height: 85vh;
        overflow: auto;
        padding: 24px;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text2);
        border-radius: 8px;
        width: 32px;
        height: 32px;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
      }
      .modal-close:hover { color: var(--text); border-color: var(--accent); }
      .modal-header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-avatar, .modal-avatar-fallback {
        width: 80px;
        height: 80px;
        border-radius: 12px;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--surface3);
        border: 1px solid var(--border);
      }
      .modal-avatar-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text2);
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
      }
      .modal-title-wrap { flex: 1; min-width: 0; }
      .modal-name-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .modal-name {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        margin: 0;
      }
      .modal-live-badge {
        background: var(--red);
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        letter-spacing: 0.03em;
      }
      .modal-bio {
        color: var(--text);
        margin: 0 0 16px;
        line-height: 1.6;
      }
      .modal-bio-empty {
        color: var(--text3);
        font-style: italic;
      }
      .modal-stats {
        color: var(--text2);
        font-size: 0.95rem;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .modal-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      @media (max-width: 560px) {
        .dj-card { flex-direction: column; align-items: stretch; }
        .avatar, .avatar-fallback { width: 100%; height: 120px; border-radius: 12px; }
        .modal-backdrop { padding: 16px; }
        .modal-header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="brand" href="/">
          <span class="dot"></span>
          STArchive
        </a>
        <a class="back" href="/">← Back to archive</a>
      </header>
      <h1>Live DJs</h1>
      <div class="status" id="status"><span class="live-dot"></span>Checking who's live…</div>
      <div id="live-list"><div class="loading">Loading live DJs…</div></div>
    </div>

    <script>
      const REFRESH_MS = 30000;
      const MODAL_REFRESH_MS = 60000;
      const listEl = document.getElementById("live-list");
      const statusEl = document.getElementById("status");
      let lastIds = [];
      let emptyShown = false;
      // /live?play=<dj> - jump to that DJ's card and start their stream.
      // Sanitised to a safe charset so it can never reach innerHTML/selectors unsafely.
      const PLAY_DJ = (new URLSearchParams(location.search).get("play") || "")
        .trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
      let playHandled = false;
      let modalEl = null;
      let modalCurrentDj = null;
      let modalRefreshTimer = null;
      let modalTrigger = null;

      function setStatus(text, live) {
        statusEl.innerHTML = live !== false
          ? '<span class="live-dot"></span>' + text
          : text;
      }

      function initials(name) {
        return name.split(/[ _]+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join("");
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
      }

      function buildTwitchViewersText(twitch) {
        if (!twitch || twitch.isLive !== true) return null;
        // Keep it minimal: viewers only (no category/game suffix).
        return typeof twitch.viewers === "number" ? "Twitch Viewers: " + twitch.viewers : null;
      }

      function updateTwitchStats(el, twitch) {
        const text = buildTwitchViewersText(twitch);
        if (text) {
          el.textContent = text;
          el.style.display = "";
        } else {
          el.textContent = "";
          el.style.display = "none";
        }
      }

      function formatUptime(startedAt) {
        if (!startedAt) return null;
        const start = new Date(startedAt);
        if (Number.isNaN(start.getTime())) return null;
        const diffMs = Date.now() - start.getTime();
        if (diffMs < 0) return null;
        const hours = Math.floor(diffMs / 3600000);
        const minutes = Math.floor((diffMs % 3600000) / 60000);
        if (hours === 0) return minutes + "m";
        return hours + "h " + minutes + "m";
      }

      function createCard(dj, avatarUrl) {
        const card = document.createElement("article");
        card.className = "dj-card";
        card.dataset.djId = dj.id;

        const img = document.createElement("img");
        img.className = "avatar";
        img.alt = "";
        img.loading = "lazy";
        if (avatarUrl) img.src = avatarUrl;
        else img.style.display = "none";
        img.onerror = function () {
          img.style.display = "none";
          fallback.style.display = "flex";
        };

        const fallback = document.createElement("div");
        fallback.className = "avatar-fallback";
        fallback.textContent = initials(dj.displayName || dj.name);
        if (avatarUrl) fallback.style.display = "none";

        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `
          <h2 class="name" role="button" tabindex="0">${escapeHtml(dj.displayName || dj.name)}</h2>
          <p class="title" title="${escapeHtml(dj.title || "")}">${dj.title ? "Now playing: " + escapeHtml(dj.title) : "Live stream"}</p>
        `;

        const stats = document.createElement("div");
        stats.className = "twitch-stats";
        stats.style.display = "none";
        updateTwitchStats(stats, dj.twitch);
        info.appendChild(stats);

        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";
        audio.src = "/stream/" + encodeURIComponent(dj.id);
        info.appendChild(audio);

        const ext = document.createElement("a");
        ext.className = "open-external";
        ext.textContent = "Open in local app (we recommend VLC)";
        // We serve the m3u (with audio/x-mpegurl content-type) so the OS opens it in
        // the user's local player (e.g. VLC) instead of a download prompt. The m3u
        // itself points at the DIRECT HQ stream on the Icecast host, so playback does
        // NOT ride this proxy (saves bandwidth).
        ext.href = "/stream/" + encodeURIComponent(dj.id) + ".m3u";
        ext.target = "_blank";

        // Link to the DJ's Twitch channel (dj.id is the Twitch username).
        const twitch = document.createElement("a");
        twitch.className = "open-external watch-twitch";
        twitch.textContent = "Watch on Twitch";
        twitch.href = "https://www.twitch.tv/" + encodeURIComponent(dj.id);
        twitch.target = "_blank";
        twitch.rel = "noopener noreferrer";

        // Both links sit side by side to keep the card compact.
        const actions = document.createElement("div");
        actions.className = "card-actions";
        actions.appendChild(ext);
        actions.appendChild(twitch);
        info.appendChild(actions);

        card.appendChild(img);
        card.appendChild(fallback);
        card.appendChild(info);
        return card;
      }

      async function fetchAvatar(id) {
        try {
          const r = await fetch("/api/artist-thumbnails?artist=" + encodeURIComponent(id));
          if (!r.ok) return null;
          const j = await r.json();
          return j && j.url ? j.url : null;
        } catch (e) {
          return null;
        }
      }

      function updateCard(card, dj) {
        const title = card.querySelector(".title");
        const stats = card.querySelector(".twitch-stats");
        if (title && dj.title) title.textContent = "Now playing: " + escapeHtml(dj.title);
        if (stats) updateTwitchStats(stats, dj.twitch);
      }

      // ---- Dad jokes for the empty state (no repeats, tracked in a cookie) ----
      var JOKE_COOKIE = "starchive_jokes_told";
      var JOKES = null;
      var jokesLoad = null;

      function readToldJokes() {
        var out = new Set();
        var m = document.cookie.match(new RegExp("(?:^|; )" + JOKE_COOKIE + "=([^;]*)"));
        if (!m) return out;
        m[1].split(",").forEach(function (s) {
          var n = parseInt(s, 10);
          if (!isNaN(n)) out.add(n);
        });
        return out;
      }

      function writeToldJokes(set) {
        document.cookie = JOKE_COOKIE + "=" + Array.from(set).join(",") +
          "; path=/; max-age=" + (365 * 24 * 3600) + "; SameSite=Lax";
      }

      function loadJokes() {
        if (JOKES) return Promise.resolve(JOKES);
        if (jokesLoad) return jokesLoad;
        jokesLoad = fetch("/dad-jokes.json")
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (arr) { JOKES = Array.isArray(arr) && arr.length ? arr : null; return JOKES; })
          .catch(function () { JOKES = null; jokesLoad = null; return null; });
        return jokesLoad;
      }

      function nextJoke() {
        var told = readToldJokes();
        var total = JOKES.length;
        var available = [];
        for (var i = 0; i < total; i++) { if (!told.has(i)) available.push(i); }
        if (!available.length) {
          told = new Set();
          for (var j = 0; j < total; j++) available.push(j);
        }
        var idx = available[Math.floor(Math.random() * available.length)];
        told.add(idx);
        writeToldJokes(told);
        return { text: JOKES[idx], left: total - told.size, total: total };
      }

      function headphonesIcon() {
        var ns = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.6");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        var p = document.createElementNS(ns, "path");
        p.setAttribute("d", "M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3");
        svg.appendChild(p);
        return svg;
      }

      function renderEmpty() {
        listEl.innerHTML = "";
        var wrap = document.createElement("div");
        wrap.className = "empty";

        var emoji = document.createElement("div");
        emoji.className = "empty-emoji";
        emoji.appendChild(headphonesIcon());

        var title = document.createElement("p");
        title.className = "empty-title";
        title.textContent = "No DJs are live right now";

        var sub = document.createElement("p");
        sub.className = "empty-sub";
        sub.textContent = "Do you want to hear a joke instead?";

        var actions = document.createElement("div");
        actions.className = "empty-actions";
        var yes = document.createElement("button");
        yes.type = "button";
        yes.className = "joke-btn primary";
        yes.textContent = "Yes, joke!";
        var browse = document.createElement("a");
        browse.className = "joke-btn";
        browse.href = "/";
        browse.textContent = "Browse the archive";
        actions.appendChild(yes);
        actions.appendChild(browse);

        var box = document.createElement("div");
        box.className = "joke-box";
        box.hidden = true;
        var text = document.createElement("p");
        text.className = "joke-text";
        var meta = document.createElement("div");
        meta.className = "joke-meta";
        var more = document.createElement("button");
        more.type = "button";
        more.className = "joke-btn";
        more.textContent = "Another";
        var check = document.createElement("button");
        check.type = "button";
        check.className = "joke-btn";
        check.textContent = "Check live";
        meta.appendChild(more);
        meta.appendChild(check);
        box.appendChild(text);
        box.appendChild(meta);

        wrap.appendChild(emoji);
        wrap.appendChild(title);
        wrap.appendChild(sub);
        wrap.appendChild(actions);
        wrap.appendChild(box);
        listEl.appendChild(wrap);

        function show(pick) {
          text.textContent = pick.text;
          box.hidden = false;
          actions.style.display = "none";
          more.textContent = "Another (" + pick.left + " left)";
        }

        yes.addEventListener("click", function () {
          yes.disabled = true;
          yes.textContent = "Loading...";
          loadJokes().then(function (jokes) {
            if (!jokes) {
              yes.disabled = false;
              yes.textContent = "Yes, joke!";
              sub.textContent = "Jokes are unavailable right now - check back later.";
              return;
            }
            show(nextJoke());
          });
        });

        more.addEventListener("click", function () { show(nextJoke()); });
        check.addEventListener("click", function () {
          setStatus("Checking...", false);
          load();
        });
      }

      async function render(djs) {
        if (!djs || !djs.length) {
          // Keep the joke state across the 30s poll: only build the empty view once.
          if (!emptyShown) { renderEmpty(); emptyShown = true; }
          setStatus("Nobody live right now", false);
          lastIds = [];
          return;
        }
        emptyShown = false;

        const ids = djs.map(d => d.id).join(",");
        if (lastIds.join(",") === ids) {
          // Same DJs — update metadata in place so audio keeps playing.
          const cards = listEl.querySelectorAll(".dj-card");
          djs.forEach((dj, i) => {
            const card = cards[i];
            if (!card) return;
            updateCard(card, dj);
          });
          setStatus(djs.length + " DJ" + (djs.length === 1 ? "" : "s") + " live");
          return;
        }

        listEl.innerHTML = "";
        for (const dj of djs) {
          const avatar = await fetchAvatar(dj.id);
          listEl.appendChild(createCard(dj, avatar));
        }
        lastIds = djs.map(d => d.id);
        setStatus(djs.length + " DJ" + (djs.length === 1 ? "" : "s") + " live");
      }

      function maybeStartRequested() {
        if (!PLAY_DJ || playHandled) return;
        const card = document.querySelector('.dj-card[data-dj-id="' + PLAY_DJ.replace(/["\\]/g, "") + '"]');
        if (!card) return;
        const audio = card.querySelector("audio");
        if (!audio) return;
        playHandled = true;
        card.scrollIntoView({ block: "center", behavior: "smooth" });
        card.classList.add("is-playing-target");
        const p = audio.play();
        if (p && p.catch) {
          p.catch(function () {
            setStatus("Press play to start " + escapeHtml(PLAY_DJ), false);
          });
        }
      }

      async function load() {
        try {
          const r = await fetch("/api/live");
          if (!r.ok) throw new Error("HTTP " + r.status);
          const djs = await r.json();
          await render(djs);
          maybeStartRequested();
        } catch (e) {
          listEl.innerHTML = '<div class="empty error">Could not load live DJs: ' + escapeHtml(e.message) + "</div>";
          setStatus("Live feed unavailable", false);
          lastIds = [];
        }
      }

      function createModal() {
        const backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";
        backdrop.style.display = "none";
        backdrop.setAttribute("role", "dialog");
        backdrop.setAttribute("aria-modal", "true");

        const panel = document.createElement("div");
        panel.className = "modal-panel";

        const closeBtn = document.createElement("button");
        closeBtn.className = "modal-close";
        closeBtn.setAttribute("aria-label", "Close");
        closeBtn.innerHTML = "&times;";
        closeBtn.addEventListener("click", closeModal);

        const header = document.createElement("div");
        header.className = "modal-header";

        const avatarImg = document.createElement("img");
        avatarImg.className = "modal-avatar";
        avatarImg.alt = "";

        const avatarFallback = document.createElement("div");
        avatarFallback.className = "modal-avatar-fallback";

        const titleWrap = document.createElement("div");
        titleWrap.className = "modal-title-wrap";

        const nameRow = document.createElement("div");
        nameRow.className = "modal-name-row";

        const nameEl = document.createElement("h2");
        nameEl.className = "modal-name";

        const liveBadge = document.createElement("span");
        liveBadge.className = "modal-live-badge";
        liveBadge.textContent = "LIVE";

        nameRow.appendChild(nameEl);
        nameRow.appendChild(liveBadge);
        titleWrap.appendChild(nameRow);
        header.appendChild(avatarImg);
        header.appendChild(avatarFallback);
        header.appendChild(titleWrap);

        const bioEl = document.createElement("p");
        bioEl.className = "modal-bio";

        const statsEl = document.createElement("div");
        statsEl.className = "modal-stats";

        const linksEl = document.createElement("div");
        linksEl.className = "modal-links";

        panel.appendChild(closeBtn);
        panel.appendChild(header);
        panel.appendChild(bioEl);
        panel.appendChild(statsEl);
        panel.appendChild(linksEl);
        backdrop.appendChild(panel);

        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeModal();
        });

        document.body.appendChild(backdrop);
        return { backdrop, closeBtn, avatarImg, avatarFallback, nameEl, liveBadge, bioEl, statsEl, linksEl };
      }

      function updateModal(data) {
        if (!modalEl || modalCurrentDj !== data.dj) return;
        const profile = data.profile || {};
        const live = data.live || {};
        const displayName = profile.displayName || data.dj;

        modalEl.backdrop.setAttribute("aria-label", displayName);
        modalEl.nameEl.textContent = displayName;

        if (profile.avatar) {
          modalEl.avatarImg.src = profile.avatar;
          modalEl.avatarImg.style.display = "";
          modalEl.avatarFallback.style.display = "none";
        } else {
          modalEl.avatarImg.style.display = "none";
          modalEl.avatarFallback.textContent = initials(displayName);
          modalEl.avatarFallback.style.display = "";
        }

        modalEl.liveBadge.style.display = live.isLive ? "" : "none";

        if (data.bio) {
          modalEl.bioEl.textContent = data.bio;
          modalEl.bioEl.classList.remove("modal-bio-empty");
        } else {
          modalEl.bioEl.textContent = "No bio.";
          modalEl.bioEl.classList.add("modal-bio-empty");
        }

        modalEl.statsEl.innerHTML = "";
        const viewersText = buildTwitchViewersText(live);
        if (viewersText) {
          const div = document.createElement("div");
          div.textContent = viewersText;
          modalEl.statsEl.appendChild(div);
        }
        if (typeof data.followers === "number") {
          const div = document.createElement("div");
          div.textContent = "Followers: " + new Intl.NumberFormat("en-US").format(data.followers);
          modalEl.statsEl.appendChild(div);
        }
        const uptime = formatUptime(live.startedAt);
        if (uptime) {
          const div = document.createElement("div");
          div.textContent = "Live for " + uptime;
          modalEl.statsEl.appendChild(div);
        }

        modalEl.linksEl.innerHTML = "";
        const twitchUrl = profile.url || (data.socials && data.socials.twitch) || "https://www.twitch.tv/" + encodeURIComponent(data.dj);
        const twitchLink = document.createElement("a");
        twitchLink.className = "open-external";
        twitchLink.textContent = "Watch on Twitch";
        twitchLink.href = twitchUrl;
        twitchLink.target = "_blank";
        twitchLink.rel = "noopener noreferrer";
        modalEl.linksEl.appendChild(twitchLink);

        const m3uLink = document.createElement("a");
        m3uLink.className = "open-external";
        m3uLink.textContent = "Open in local app";
        m3uLink.href = "/stream/" + encodeURIComponent(data.dj) + ".m3u";
        m3uLink.target = "_blank";
        m3uLink.rel = "noopener noreferrer";
        modalEl.linksEl.appendChild(m3uLink);
      }

      async function loadModalData(djId) {
        try {
          const r = await fetch("/api/dj-profile?dj=" + encodeURIComponent(djId));
          if (!r.ok) throw new Error("HTTP " + r.status);
          const data = await r.json();
          if (modalCurrentDj === djId) updateModal(data);
        } catch (e) {
          // Silently ignore modal refresh failures; stale data remains visible.
        }
      }

      async function openModal(djId) {
        if (!modalEl) modalEl = createModal();
        clearInterval(modalRefreshTimer);
        modalRefreshTimer = null;
        modalCurrentDj = djId;
        modalTrigger = document.activeElement;
        modalEl.backdrop.style.display = "";
        document.body.style.overflow = "hidden";
        modalEl.closeBtn.focus();
        await loadModalData(djId);
        modalRefreshTimer = setInterval(() => {
          if (modalCurrentDj) loadModalData(modalCurrentDj);
        }, MODAL_REFRESH_MS);
      }

      function closeModal() {
        if (!modalEl) return;
        clearInterval(modalRefreshTimer);
        modalRefreshTimer = null;
        modalCurrentDj = null;
        modalEl.backdrop.style.display = "none";
        document.body.style.overflow = "";
        if (modalTrigger) {
          modalTrigger.focus();
          modalTrigger = null;
        }
      }

      listEl.addEventListener("click", (e) => {
        const name = e.target.closest(".dj-card .name");
        if (!name) return;
        const card = name.closest(".dj-card");
        if (card && card.dataset.djId) openModal(card.dataset.djId);
      });

      listEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const name = e.target.closest(".dj-card .name");
        if (!name) return;
        e.preventDefault();
        const card = name.closest(".dj-card");
        if (card && card.dataset.djId) openModal(card.dataset.djId);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalEl && modalEl.backdrop.style.display !== "none") closeModal();
      });

      window.addEventListener("beforeunload", closeModal);

      load();
      setInterval(load, REFRESH_MS);
    </script>
  </body>
</html>
