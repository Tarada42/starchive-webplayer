<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STArchive Editor — DJ Socials</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #11111c;
      --text: #e2e2e8;
      --muted: #9ca3af;
      --accent: #7C3AED;
      --accent-light: #A855F7;
      --border: #22222c;
      --error: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: var(--accent-light); }
    button.secondary { background: #27272f; }
    button.secondary:hover { background: #343440; }
    button.danger { background: #7f1d1d; }
    button.danger:hover { background: #991b1b; }
    .container { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
    .status { min-height: 1.5rem; margin-bottom: 1rem; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--error); }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .card h2 { margin: 0 0 0.75rem; font-size: 1.1rem; word-break: break-all; }
    .field { margin-bottom: 0.75rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: capitalize; }
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 0.25rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }
    .readonly { color: var(--muted); font-size: 0.875rem; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .add-card { grid-column: 1 / -1; }
    #addForm {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>STArchive Editor — DJ Socials</h1>
    <button id="addBtn">Add DJ</button>
  </header>
  <div class="container">
    <div id="status" class="status"></div>
    <div id="addForm" class="add-card card">
      <h2>New DJ</h2>
      <div class="field">
        <label for="new-username">Username</label>
        <input type="text" id="new-username" placeholder="djname">
      </div>
      <div id="new-socials"></div>
      <div class="actions">
        <button id="saveNewBtn">Save</button>
        <button class="secondary" id="cancelAddBtn">Cancel</button>
      </div>
    </div>
    <div id="djs" class="grid"></div>
  </div>
  <script>
    const ALLOWED_KEYS = ["x", "twitter", "instagram", "youtube", "discord", "tiktok", "website"];
    const API_BASE = "/coliflower";
    const statusEl = document.getElementById("status");
    const djsEl = document.getElementById("djs");
    const addForm = document.getElementById("addForm");
    const newUsername = document.getElementById("new-username");
    const newSocialsEl = document.getElementById("new-socials");

    function setStatus(msg, ok) {
      statusEl.textContent = msg || "";
      statusEl.className = "status " + (ok ? "ok" : msg ? "error" : "");
    }

    function escapeHtml(v) {
      return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function buildSocialInputs(prefix, values) {
      return ALLOWED_KEYS.map(k => {
        const val = (values && values[k]) || "";
        return `<div class="field">
          <label for="${prefix}-${k}">${k}</label>
          <input type="text" id="${prefix}-${k}" value="${escapeHtml(val)}" placeholder="https://...">
        </div>`;
      }).join("");
    }

    function gatherSocials(prefix) {
      const out = {};
      for (const k of ALLOWED_KEYS) {
        const el = document.getElementById(`${prefix}-${k}`);
        const v = el ? el.value.trim() : "";
        if (v) out[k] = v;
      }
      return out;
    }

    async function api(method, endpoint, body) {
      const opts = { method, headers: {} };
      if (body) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(API_BASE + endpoint, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    async function load() {
      setStatus("Loading...");
      try {
        const data = await api("GET", "/socials");
        const djs = data.djs || {};
        djsEl.innerHTML = "";
        for (const [username, socials] of Object.entries(djs)) {
          const id = `dj-${username}`;
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <h2>${escapeHtml(username)}</h2>
            <div class="field">
              <label>Twitch</label>
              <div class="readonly">Always linked — https://www.twitch.tv/${escapeHtml(username)}</div>
            </div>
            ${buildSocialInputs(id, socials)}
            <div class="actions">
              <button data-user="${escapeHtml(username)}">Save</button>
              <button class="danger" data-user="${escapeHtml(username)}">Remove</button>
            </div>
          `;
          div.querySelector("button:not(.danger)").addEventListener("click", () => save(username, id));
          div.querySelector("button.danger").addEventListener("click", () => remove(username));
          djsEl.appendChild(div);
        }
        newSocialsEl.innerHTML = buildSocialInputs("new", {});
        setStatus("");
      } catch (e) {
        setStatus("Load failed: " + e.message);
      }
    }

    async function save(username, prefix) {
      setStatus("Saving...");
      try {
        await api("POST", "/socials", { username, socials: gatherSocials(prefix) });
        setStatus("Saved", true);
        await load();
      } catch (e) {
        setStatus("Save failed: " + e.message);
      }
    }

    async function remove(username) {
      if (!confirm(`Remove ${username}?`)) return;
      setStatus("Removing...");
      try {
        await api("POST", "/socials/delete", { username });
        setStatus("Removed", true);
        await load();
      } catch (e) {
        setStatus("Remove failed: " + e.message);
      }
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      addForm.style.display = addForm.style.display === "block" ? "none" : "block";
    });
    document.getElementById("cancelAddBtn").addEventListener("click", () => {
      addForm.style.display = "none";
      newUsername.value = "";
    });
    document.getElementById("saveNewBtn").addEventListener("click", async () => {
      const u = newUsername.value.trim();
      if (!/^[a-zA-Z0-9_]+$/.test(u)) {
        setStatus("Invalid username");
        return;
      }
      setStatus("Saving...");
      try {
        await api("POST", "/socials", { username: u, socials: gatherSocials("new") });
        setStatus("Saved", true);
        newUsername.value = "";
        addForm.style.display = "none";
        await load();
      } catch (e) {
        setStatus("Save failed: " + e.message);
      }
    });

    load();
  </script>
</body>
</html>
